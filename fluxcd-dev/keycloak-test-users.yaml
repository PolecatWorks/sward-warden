# This file provisions test users with different role permissions (Admin, Support, Viewer, User)
# in Keycloak using the EPAM Keycloak Operator (KeycloakRealmUser CR) with shared ESO password generation.
#
# Users provisioned:
# 1. johnsnow (User role) - dev-user-johnsnow
# 2. testadmin (Admin role) - dev-user-testadmin
# 3. testsupport (Support role) - dev-user-testsupport
# 4. testviewer (Viewer role) - dev-user-testviewer
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: keycloak-users-password-gen
  namespace: sward-warden-dev
spec:
  length: 24
  digits: 5
  symbols: 3
  symbolCharacters: "!@#$%"
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-users-shared-password
  namespace: sward-warden-dev
spec:
  refreshInterval: "0"
  target:
    name: keycloak-users-shared-password
    creationPolicy: Owner
    template:
      data:
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: keycloak-users-password-gen
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakRealmUser
metadata:
  name: dev-user-johnsnow
  namespace: sward-warden-dev
spec:
  realmRef:
    kind: KeycloakRealm
    name: sw-dev
  username: johnsnow
  email: john.snow13@example.com
  firstName: John
  lastName: Snow
  enabled: true
  emailVerified: true
  roles:
    - offline_access
  groups:
    - sw-users
  passwordSecret:
    name: keycloak-users-shared-password
    key: password
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakRealmUser
metadata:
  name: dev-user-testadmin
  namespace: sward-warden-dev
spec:
  realmRef:
    kind: KeycloakRealm
    name: sw-dev
  username: testadmin
  email: test.admin@example.com
  firstName: Test
  lastName: Admin
  enabled: true
  emailVerified: true
  roles:
    - offline_access
  groups:
    - sw-admin
  passwordSecret:
    name: keycloak-users-shared-password
    key: password
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakRealmUser
metadata:
  name: dev-user-testsupport
  namespace: sward-warden-dev
spec:
  realmRef:
    kind: KeycloakRealm
    name: sw-dev
  username: testsupport
  email: test.support@example.com
  firstName: Test
  lastName: Support
  enabled: true
  emailVerified: true
  roles:
    - offline_access
  groups:
    - sw-support
  passwordSecret:
    name: keycloak-users-shared-password
    key: password
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakRealmUser
metadata:
  name: dev-user-testviewer
  namespace: sward-warden-dev
spec:
  realmRef:
    kind: KeycloakRealm
    name: sw-dev
  username: testviewer
  email: test.viewer@example.com
  firstName: Test
  lastName: Viewer
  enabled: true
  emailVerified: true
  roles:
    - offline_access
  groups:
    - sw-viewer
  passwordSecret:
    name: keycloak-users-shared-password
    key: password
